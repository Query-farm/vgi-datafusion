name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "3"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # Keep the sibling source reviewable and reproducible. Update this hash only
  # with the vgi-datafusion compatibility change that has been reviewed against it.
  VGI_RUST_REVISION: "074ae2239a353bf8297a405b18c5bb0fefe9c032"
  VGI_RUST_REGISTRY_VERSION: "0.31.0"

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out vgi-datafusion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vgi-datafusion
          persist-credentials: false

      - name: Check out vgi-rust
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Query-farm/vgi-rust
          ref: 074ae2239a353bf8297a405b18c5bb0fefe9c032 # Released v0.31.0 integration and timeout fixtures.
          path: vgi-rust
          persist-credentials: false

      - name: Check out Apache DataFusion 55
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: apache/datafusion
          ref: 55.0.0
          path: datafusion
          persist-credentials: false

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-26
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Report toolchain and source revisions
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          printf 'vgi-datafusion %s\n' "$(git -C vgi-datafusion rev-parse HEAD)"
          vgi_rust_revision="$(git -C vgi-rust rev-parse HEAD)"
          printf 'vgi-rust       %s (expected %s)\n' "$vgi_rust_revision" "$VGI_RUST_REVISION"
          test "$vgi_rust_revision" = "$VGI_RUST_REVISION"
          printf 'datafusion     %s\n' "$(git -C datafusion rev-parse HEAD)"

      - name: Build VGI example worker fixture
        working-directory: vgi-rust
        run: |
          cargo generate-lockfile
          cargo build --locked --package vgi-example-worker
          test -x target/debug/vgi-example-worker

      - name: Check formatting
        working-directory: vgi-datafusion
        run: cargo fmt --all -- --check

      - name: Resolve dependencies
        working-directory: vgi-datafusion
        run: cargo generate-lockfile

      - name: Check package and registry reproducibility
        working-directory: vgi-datafusion
        shell: bash
        run: |
          set -euo pipefail

          package_files="${RUNNER_TEMP}/vgi-datafusion-package-files.txt"
          cargo package --list >"$package_files"
          for required in Cargo.toml Cargo.toml.orig LICENSE README.md src/lib.rs; do
            grep -Fqx "$required" "$package_files"
          done
          if grep -Eq '(^|/)(target|\.git)/' "$package_files"; then
            echo "::error::package contains build or repository internals"
            exit 1
          fi

          registry_ready=true
          for package in vgi-client vgi-protocol; do
            # Query the live crates.io API rather than accepting a possibly
            # stale local index after a failed update. Network, rate-limit, and
            # unexpected API responses fail closed.
            api_response="${RUNNER_TEMP}/${package}-registry.json"
            if ! http_code="$(curl --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --user-agent 'Query-farm-vgi-datafusion-ci/0.1 (https://github.com/Query-farm/vgi-datafusion)' \
              --output "$api_response" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${package}/${VGI_RUST_REGISTRY_VERSION}")"; then
              echo "::error::could not query crates.io for ${package}@${VGI_RUST_REGISTRY_VERSION}"
              exit 1
            fi
            if [[ "$http_code" == 200 ]]; then
              actual_version="$(jq -er '.version.num' "$api_response")"
              test "$actual_version" = "$VGI_RUST_REGISTRY_VERSION"
            elif [[ "$http_code" == 404 ]]; then
              registry_ready=false
              echo "::notice::${package}@${VGI_RUST_REGISTRY_VERSION} is not published"
            else
              cat "$api_response" >&2
              echo "::error::crates.io returned HTTP ${http_code} for ${package}@${VGI_RUST_REGISTRY_VERSION}"
              exit 1
            fi
          done
          if [[ "$registry_ready" == true ]]; then
            # Verification occurs from Cargo's normalized package, where path
            # dependencies are removed and the VGI crates come from crates.io.
            cargo publish --dry-run --locked
          else
            # Exact-version absence was established from the live API above.
            echo "::notice::registry-only publish dry-run deferred until both VGI ${VGI_RUST_REGISTRY_VERSION} crates are published"
          fi

      - name: Check all targets
        working-directory: vgi-datafusion
        run: cargo check --locked --all-targets

      - name: Run strict Clippy
        working-directory: vgi-datafusion
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: vgi-datafusion
        run: cargo test --locked --all-targets

      - name: Run persistent-worker tests (Unix)
        working-directory: vgi-datafusion
        shell: bash
        run: |
          set -euo pipefail
          worker=../vgi-rust/target/debug/vgi-example-worker
          socket="${RUNNER_TEMP}/vgi-durable-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sock"
          log="${RUNNER_TEMP}/vgi-durable-cache-unix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          worker_pid=""

          cleanup() {
            local status=$?
            local state=""
            trap - EXIT
            if [[ -n "$worker_pid" ]]; then
              kill -TERM "$worker_pid" 2>/dev/null || true
              for _ in $(seq 1 50); do
                state="$(ps -o stat= -p "$worker_pid" 2>/dev/null | tr -d '[:space:]' || true)"
                [[ -z "$state" || "$state" == Z* ]] && break
                sleep 0.1
              done
              if [[ -n "$state" && "$state" != Z* ]]; then
                kill -KILL "$worker_pid" 2>/dev/null || true
              fi
              wait "$worker_pid" 2>/dev/null || true
            fi
            if [[ $status -ne 0 && -f "$log" ]]; then
              echo "::group::Unix worker log"
              cat "$log"
              echo "::endgroup::"
            fi
            rm -f "$socket" "$log"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          rm -f "$socket" "$log"
          "$worker" --unix "$socket" >"$log" 2>&1 &
          worker_pid=$!
          for _ in $(seq 1 200); do
            if [[ -S "$socket" ]]; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              echo "::error::Unix worker exited before creating $socket"
              exit 1
            fi
            sleep 0.05
          done
          if [[ ! -S "$socket" ]]; then
            echo "::error::Unix worker did not create $socket within 10 seconds"
            exit 1
          fi

          VGI_TEST_WORKER="unix://${socket}" \
            cargo test --locked \
              --test durable_producer_cache \
              --test worker_log_forwarding \
              -- --nocapture

      - name: Run persistent-worker tests (HTTP)
        working-directory: vgi-datafusion
        shell: bash
        run: |
          set -euo pipefail
          worker=../vgi-rust/target/debug/vgi-example-worker
          log="${RUNNER_TEMP}/vgi-durable-cache-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          worker_pid=""
          port=""

          cleanup() {
            local status=$?
            local state=""
            trap - EXIT
            if [[ -n "$worker_pid" ]]; then
              kill -TERM "$worker_pid" 2>/dev/null || true
              for _ in $(seq 1 50); do
                state="$(ps -o stat= -p "$worker_pid" 2>/dev/null | tr -d '[:space:]' || true)"
                [[ -z "$state" || "$state" == Z* ]] && break
                sleep 0.1
              done
              if [[ -n "$state" && "$state" != Z* ]]; then
                kill -KILL "$worker_pid" 2>/dev/null || true
              fi
              wait "$worker_pid" 2>/dev/null || true
            fi
            if [[ $status -ne 0 && -f "$log" ]]; then
              echo "::group::HTTP worker log"
              cat "$log"
              echo "::endgroup::"
            fi
            rm -f "$log"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          rm -f "$log"
          "$worker" --http >"$log" 2>&1 &
          worker_pid=$!
          for _ in $(seq 1 200); do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              echo "::error::HTTP worker exited before announcing a port"
              exit 1
            fi
            if [[ -f "$log" ]]; then
              port="$(sed -n 's/.*PORT:\([0-9][0-9]*\).*/\1/p' "$log" | head -1)"
            fi
            if [[ -n "$port" ]]; then
              break
            fi
            sleep 0.05
          done
          if [[ -z "$port" ]]; then
            echo "::error::HTTP worker did not announce a port within 10 seconds"
            exit 1
          fi

          VGI_TEST_WORKER="http://127.0.0.1:${port}" \
            cargo test --locked \
              --test durable_producer_cache \
              --test worker_log_forwarding \
              -- --nocapture

      - name: Report compiler cache statistics
        if: always()
        run: sccache --show-stats
