[package]
name = "vgi-datafusion"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
description = "Apache DataFusion integration for the VGI protocol — attach a remote VGI catalog and query it with SQL"
readme = "README.md"
keywords = ["vgi", "datafusion", "arrow", "sql", "federation"]
categories = ["database", "api-bindings"]

[dependencies]
vgi-client = { version = "0.31.0", path = "../vgi-rust/vgi-client", features = ["unix", "launcher"] }
vgi-protocol = { version = "0.31.0", path = "../vgi-rust/vgi-protocol" }
# Arrow comes from DataFusion's re-export rather than a direct dependency:
# pinning it separately is how you end up with two incompatible `ArrayRef`
# types that look identical in the error message.
#
# The version makes the crate publishable against the DataFusion 55 release,
# whose Arrow 59.2 dependency matches vgi-rust. The path keeps sibling checkout
# development (especially datafusion-cli) on one copy of DataFusion's types.
datafusion = { version = "55.0.0", path = "../datafusion/datafusion/core" }
async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "rt-multi-thread", "macros", "time"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
